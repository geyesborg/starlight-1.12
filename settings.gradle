pluginManagement {
    repositories {
        maven { url = 'https://maven.cleanroommc.com' }
        gradlePluginPortal() {
            content {
                excludeGroup('org.apache.logging.log4j')
            }
        }
        mavenCentral()
        maven { url = 'https://maven.minecraftforge.net/' }
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://maven.wagyourtail.xyz/releases' }
        maven { url = 'https://maven.arcseekers.com/releases' }
        maven { url = 'https://maven.wagyourtail.xyz/snapshots' }
        maven { url = 'https://maven.outlands.top/releases' }
    }
}

plugins {
    id 'com.cleanroommc.cleanroomgradle.settings' version '0.17.4'
    id 'com.cleanroommc.conventions.settings' version '1.1.7'
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = rootProject.projectDir.getName()
