# Gradle Properties
# Gradle's own native-platform library calls System::load, which JDK 25 reports as a restricted method.
org.gradle.jvmargs = -Xmx3G --enable-native-access=ALL-UNNAMED
org.gradle.java.home = C:\\Program Files\\Eclipse Adoptium\\jdk-25.0.5.7-hotspot
org.gradle.java.installations.auto-detect = false
cg.repos.enableLocal = true

# Cleanroom Conventions (GPL-3.0: derived from Moonrise/Starlight by Spottedleaf)
conventions.license = open

# Compilation Options
generate_sources_jar = true
generate_javadocs_jar = false

# Testing
enable_junit_testing = true
show_testing_output = false

# Shadow
enable_shadow = false

# LWJGL2 compat layer (not needed — we target core profile with LWJGL3)
enable_lwjglx = false

# Mod Information
mod_version = 0.1.0
root_package = com.github.starlight
mod_id = starlight
mod_name = Starlight (1.12.2 port)

# Mod Metadata
mod_description = Starlight lighting engine (from Moonrise by Spottedleaf) ported to Minecraft 1.12.2 on Cleanroom
mod_url =
mod_update_json =
mod_authors = geyesborg
mod_credits = Spottedleaf (Starlight/Moonrise, GPL-3.0); Red Studio (Alfheim, MIT) for 1.12 hook research
mod_logo_path =

# Run Configurations
minecraft_username = Developer
extra_jvm_args = -Xmx4G -Xms2G
enable_foundation_debug = false
enable_cleanmix_hooks = true

# Maven Publishing
publish_to_maven = false
publish_to_local_maven = false
maven_name = ${mod_name}
maven_url =

# Access Transformers
use_access_transformer = false
access_transformer_locations = ${mod_id}_at.cfg

# Coremods
is_coremod = false
coremod_includes_mod = false
coremod_plugin_class_name =

# AssetMover
use_asset_mover = false
asset_mover_version = 2.5
